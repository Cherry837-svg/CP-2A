<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Линейные интерполяционные часы</title>
    <style>
        body {
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10; 
            /* Добавлена плавная анимация, чтобы часы не дергались при смещении */
            transition: transform 1.5s ease-in-out;
            transform: translate3d(0px, 0px, 0px);
        }

        .date-row {
            color: #00ff99;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(127, 255, 0, 0.6), 
                        0 0 30px rgba(127, 255, 0, 0.3);
        }

        .clock {
            font-size: 6rem; 
            font-weight: 800;
            letter-spacing: 0.7px;
            transition: color 0.5s linear, text-shadow 0.4s linear; 
        }

        .battery-info {
            color: #00ffff;
            font-size: 1.5rem;
            margin-top: 25px;
            font-weight: bold;
            font-family: sans-serif;
            letter-spacing: 1px;
        }

        .status-indicators {
            margin-top: 15px;
            font-family: sans-serif;
            font-size: 0.85rem;
            color: #666;
            transition: color 0.3s ease;
        }
        
        .active-status {
            color: #00ffff !important;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .wakelock-active {
            color: #ff3333 !important;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
    </style>
</head>
<body>

    <div class="clock-container" id="interactive-zone">
        <div id="date" class="date-row">ПТ : 00.00.0000</div>
        <div id="clock" class="clock">00:00</div>
        <div id="battery" class="battery-info">Запрос данных батареи...</div>
        <div class="status-indicators">
            <span id="fullscreen-status">🔍 Обычный режим</span> | 
            <span id="wakelock-status">💤 Сон разрешен</span>
        </div>
    </div>

    <script>
        const daysOfWeek = ['7-ВС', '1-ПН', '2-ВТ', '3-СР', '4-ЧТ', '5-ПТ', '6-СБ'];

        // --- Основные Часы ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = now.getSeconds();
            const separator = (seconds % 2 === 0) ? ':' : ' ';
            
            document.getElementById('clock').textContent = `${hours}${separator}${minutes}`;

            const dayName = daysOfWeek[now.getDay()];
            const dayNum = String(now.getDate()).padStart(2, '0');
            const monthNum = String(now.getMonth() + 1).padStart(2, '0');
            const yearNum = now.getFullYear();
            
            document.getElementById('date').textContent = `${dayName} : ${dayNum}.${monthNum}.${yearNum}`;
        }

        // --- Цвет от Батареи ---
        function updateClockColor(batteryLevel) {
            const percent = batteryLevel * 100;
            const clockEl = document.getElementById('clock');
            const batteryEl = document.getElementById('battery');

            batteryEl.textContent = ` ${Math.round(percent)}_%`;

            const hue = batteryLevel * 270;
            let lightness = 50;
            if (percent < 20) {
                lightness = 30 + (percent / 20) * 20;
            }

            const finalColor = `hsl(${hue}, 100%, ${lightness}%)`;
            clockEl.style.color = finalColor;
            clockEl.style.textShadow = `0 0 20px hsl(${hue}, 100%, ${lightness}%, 0.6), 
                                        0 0 45px hsl(${hue}, 100%, ${lightness}%, 0.25)`;
        }

        setInterval(updateClock, 500);
        updateClock();

        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateClockColor(battery.level);
                battery.addEventListener('levelchange', function() {
                    updateClockColor(battery.level);
                });
            });
        } else {
            document.getElementById('battery').textContent = "ДЕМО-РЕЖИМ (ЭМУЛЯЦИЯ РАЗРЯДКИ)";
            let fakeLevel = 1.0;
            setInterval(() => {
                fakeLevel -= 0.005;
                if (fakeLevel < 0) fakeLevel = 1.0;
                updateClockColor(fakeLevel);
            }, 100);
        }

        // --- ЗАЩИТА ОТ ВЫГОРАНИЯ (Микросмещение / Pixel Shift) ---
        let burnInAngle = 0;
        const maxBurnInShift = 25; // Смещение до 25 пикселей в любую сторону

        function runPixelShift() {
            const container = document.getElementById('interactive-zone');
            
            // Движение по круговой орбите, чтобы задействовать соседние диоды
            burnInAngle += 0.4; 
            
            // Округляем до целых пикселей (Math.round), чтобы текст оставался четким и не мылился
            const shiftX = Math.round(Math.cos(burnInAngle) * maxBurnInShift);
            const shiftY = Math.round(Math.sin(burnInAngle) * maxBurnInShift);
            
            container.style.transform = `translate3d(${shiftX}px, ${shiftY}px, 0px)`;
        }

        // Смещаем экран каждые 60 секунд
        setInterval(runPixelShift, 6000);
        runPixelShift(); // Первое смещение сразу при загрузке


        // --- Управление засыпанием экрана (WakeLock + Резерв) ---
        let wakeLock = null;
        let fallbackInterval = null; 
        let lastTapTime = 0;
        let tapCount = 0;
        let tapTimeout;

        const fullscreenStatus = document.getElementById('fullscreen-status');
        const wakelockStatus = document.getElementById('wakelock-status');

        async function toggleWakeLock() {
            const isInactive = (wakeLock === null && fallbackInterval === null);

            if (isInactive) {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => {
                            if (wakeLock !== null) {
                                wakeLock = null;
                                setSleepAllowed();
                            }
                        });
                        setSleepBlocked();
                        return;
                    }
                    throw new Error("Не поддерживается");
                } catch (err) {
                    console.log("Основной WakeLock недоступен, включен резервный метод.");
                    if (fallbackInterval === null) {
                        fallbackInterval = setInterval(() => {
                            window.location.href = window.location.href; 
                            window.history.replaceState(null, null, window.location.pathname);
                        }, 15000); 
                    }
                    setSleepBlocked();
                }
            } else {
                if (wakeLock !== null) {
                    await wakeLock.release();
                    wakeLock = null;
                }
                if (fallbackInterval !== null) {
                    clearInterval(fallbackInterval);
                    fallbackInterval = null;
                }
                setSleepAllowed();
            }
        }

        function setSleepBlocked() {
            wakelockStatus.textContent = "🔥 НЕГАСНУЩИЙ ЭКРАН";
            wakelockStatus.className = 'wakelock-active';
        }

        function setSleepAllowed() {
            wakelockStatus.textContent = "💤 Сон разрешен";
            wakelockStatus.className = '';
        }

        // --- Восстановленная обработка тапов и Полноэкранный режим ---
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .then(() => { fullscreenStatus.textContent = "📺 Полный экран"; })
                    .catch(err => console.log(err));
            } else {
                document.exitFullscreen()
                    .then(() => { fullscreenStatus.textContent = "🔍 Обычный режим"; });
            }
        }

        function handleTap(e) {
            const currentTime = new Date().getTime();
            const tapDelay = 300; 

            if (currentTime - lastTapTime < tapDelay) {
                tapCount++;
            } else {
                tapCount = 1;
            }
            
            lastTapTime = currentTime;

            clearTimeout(tapTimeout);
            
            // Если двойной тап — переключаем WakeLock, если тройной — полный экран
            tapTimeout = setTimeout(() => {
                if (tapCount === 2) {
                    toggleWakeLock();
                } else if (tapCount === 3) {
                    toggleFullscreen();
                }
                tapCount = 0;
            }, tapDelay);
        }

        document.getElementById('interactive-zone').addEventListener('click', handleTap);
    </script>
</body>
</html>
